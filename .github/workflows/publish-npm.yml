name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Verify release tag and package metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (tag !== `v${pkg.version}`) {
            console.error(`Release tag ${tag} does not match package version v${pkg.version}`);
            process.exit(1);
          }
          if (pkg.license !== 'Apache-2.0') {
            console.error(`Expected license Apache-2.0, got ${pkg.license}`);
            process.exit(1);
          }
          if (!pkg.bin?.orchill || !pkg.files?.includes('dist') || !pkg.files?.includes('registry')) {
            console.error('Package metadata is missing the CLI executable or required bundled directories.');
            process.exit(1);
          }
          NODE
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Install dependencies and build
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Inspect the package contents
        run: npm pack --dry-run

      - name: Publish package with npm provenance
        run: npm publish --provenance --access public
