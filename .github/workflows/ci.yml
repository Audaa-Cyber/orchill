name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Report bundled-skill release approval gaps (non-blocking until review is complete)
        run: npm run release:check
      - name: Generate third-party provenance inventory
        run: npm run provenance:inventory -- --output=reports/provenance-inventory.json
      - run: npm run release:review-queue -- --output=reports/release-review-queue.json
      - run: npm run release:review-queue -- --format=csv --output=reports/release-review-queue.csv
      - run: npm test
      - run: npm run build
      - run: npm run catalog:generate
      - name: Verify generated catalog and project license metadata
        run: |
          git diff --exit-code -- catalog reports
          test ! -e .orchill-skills-import/skills
          test ! -e .orchill-marketplace-import-fixed/skills
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); const r=JSON.parse(fs.readFileSync('registry/skills.json','utf8')); const local=r.skills.filter(s=>s.source?.type==='local'); if(p.license!=='Apache-2.0') throw new Error('Project license metadata must be Apache-2.0'); if(local.length!==190 || local.some(s=>!s.source.path?.startsWith('../skills/'))) throw new Error('Expected all 190 reviewed local skills under categorized skills/ paths'); const x=JSON.parse(fs.readFileSync('registry/excluded-payloads.json','utf8')); const ids=new Set(r.skills.map(s=>s.id)); for(const e of x.exclusions){ if(ids.has(e.id)) throw new Error('Excluded payload still registered: '+e.id); if(!fs.existsSync('third-party-review/'+e.category.toLowerCase().replace(/&/g,' and ').normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'/'+e.id+'/SKILL.md')) throw new Error('Excluded payload missing from quarantine: '+e.id); if(fs.existsSync('skills/'+e.category.toLowerCase().replace(/&/g,' and ').normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'/'+e.id)) throw new Error('Excluded payload still shipped under skills/: '+e.id); } if(x.exclusions.length!==20) throw new Error('Expected 20 quarantined exclusions'); console.log('License, categorized registry paths, and quarantine integrity verified.');"
      - run: npm run package:smoke
      - run: node dist/cli.js --help
      - run: node dist/cli.js --version
      - run: node dist/cli.js list
      - run: node dist/cli.js list --all
      - run: node dist/cli.js list "UI/UX"
      - run: node dist/cli.js info frontend-design
      - run: node dist/cli.js add frontend-design --dry-run
      - name: Pack and test the published CLI surface
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/orchill-*.tgz
          orchill --help
          orchill --version
          orchill list --all
          orchill add frontend-design --dry-run
          mkdir -p "$RUNNER_TEMP/orchill-smoke-project" "$RUNNER_TEMP/orchill-init-smoke" "$RUNNER_TEMP/orchill-category-smoke"
          orchill init --cwd "$RUNNER_TEMP/orchill-init-smoke"
          test -d "$RUNNER_TEMP/orchill-init-smoke/.agents/skills"
          test -f "$RUNNER_TEMP/orchill-init-smoke/AGENTS.md"
          grep -q '<!-- orchill:begin -->' "$RUNNER_TEMP/orchill-init-smoke/AGENTS.md"
          orchill init --cwd "$RUNNER_TEMP/orchill-init-smoke"
          test "$(grep -c '<!-- orchill:begin -->' "$RUNNER_TEMP/orchill-init-smoke/AGENTS.md")" -eq 1
          mkdir -p "$RUNNER_TEMP/orchill-existing-project/.agents"
          printf '# Existing project instructions\n\nKeep this text.\n' > "$RUNNER_TEMP/orchill-existing-project/AGENTS.md"
          orchill init --cwd "$RUNNER_TEMP/orchill-existing-project"
          grep -q 'Keep this text.' "$RUNNER_TEMP/orchill-existing-project/AGENTS.md"
          orchill add analyzing-dotnet-performance --cwd "$RUNNER_TEMP/orchill-smoke-project" --yes
          test -f "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/net-and-build-systems/analyzing-dotnet-performance/SKILL.md"
          test -f "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/net-and-build-systems/analyzing-dotnet-performance/references/critical-patterns.md"
          orchill add Accessibility --yes --cwd "$RUNNER_TEMP/orchill-category-smoke"
          test -f "$RUNNER_TEMP/orchill-category-smoke/.agents/skills/accessibility/audit-website/SKILL.md"
          test ! -e "$RUNNER_TEMP/orchill-category-smoke/.agents/skills/accessibility/web-design-guidelines"
          orchill add demo-focus --cwd "$RUNNER_TEMP/orchill-smoke-project" --yes
          test -f "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/agent-tooling-and-workflows/demo-focus/SKILL.md"
          orchill check demo-focus --cwd "$RUNNER_TEMP/orchill-smoke-project"
          orchill remove demo-focus --yes --cwd "$RUNNER_TEMP/orchill-smoke-project"
          test ! -e "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/agent-tooling-and-workflows/demo-focus"
