name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Report bundled-skill release approval gaps (non-blocking until review is complete)
        run: npm run release:check
      - name: Generate third-party provenance inventory
        run: npm run provenance:inventory -- --output=reports/provenance-inventory.json
      - run: npm run release:review-queue -- --output=reports/release-review-queue.json
      - run: npm run release:review-queue -- --format=csv --output=reports/release-review-queue.csv
      - run: npm test
      - run: npm run build
      - run: npm run catalog:generate
      - name: Verify generated catalog and project license metadata
        run: |
          git diff --exit-code -- catalog reports
          test ! -e .orchill-skills-import/skills
          test ! -e .orchill-marketplace-import-fixed/skills
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); const r=JSON.parse(fs.readFileSync('registry/skills.json','utf8')); const local=r.skills.filter(s=>s.source?.type==='local'); if(p.license!=='Apache-2.0') throw new Error('Project license metadata must be Apache-2.0'); if(local.length!==189 || local.some(s=>!s.source.path?.startsWith('../skills/'))) throw new Error('Expected all 189 reviewed local skills under categorized skills/ paths'); const x=JSON.parse(fs.readFileSync('registry/excluded-payloads.json','utf8')); const ids=new Set(r.skills.map(s=>s.id)); for(const e of x.exclusions){ if(ids.has(e.id)) throw new Error('Excluded payload still registered: '+e.id); if(!fs.existsSync('third-party-review/'+e.category.toLowerCase().replace(/&/g,' and ').normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'/'+e.id+'/SKILL.md')) throw new Error('Excluded payload missing from quarantine: '+e.id); if(fs.existsSync('skills/'+e.category.toLowerCase().replace(/&/g,' and ').normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'/'+e.id)) throw new Error('Excluded payload still shipped under skills/: '+e.id); } if(x.exclusions.length!==20) throw new Error('Expected 20 quarantined exclusions'); console.log('License, categorized registry paths, and quarantine integrity verified.');"
      - run: npm run package:smoke
      - run: node dist/cli.js import-commands --help
      - run: node --input-type=module -e "import { parseMarketplaceCommand } from './dist/marketplace-import.js'; if (parseMarketplaceCommand('/plugin install dotnet-diag@dotnet-agent-skills', 1).plugin !== 'dotnet-diag') process.exit(1)"
      - run: node dist/cli.js --help
      - run: node dist/cli.js list --all
      - run: node dist/cli.js add demo-focus --dry-run
      - name: Pack and install the actual CLI package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/orchill-*.tgz
          orchill --help
          orchill search demo
          orchill list
          set +e
          orchill audit --json > "$RUNNER_TEMP/orchill-audit.json"
          audit_status=$?
          set -e
          test "$audit_status" -le 1
          node --input-type=module -e "import fs from 'node:fs'; const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!report.summary || !Array.isArray(report.findings) || report.summary.totalSkills < 1) process.exit(1); console.log(JSON.stringify({ auditSummary: report.summary, findingsByCode: report.findings.reduce((counts, finding) => (counts[finding.code] = (counts[finding.code] || 0) + 1, counts), {}) }, null, 2))" "$RUNNER_TEMP/orchill-audit.json"
          orchill list "UI/UX"
          orchill info frontend-design
          orchill targets
          orchill registry
          orchill add frontend-design --dry-run
          mkdir -p "$RUNNER_TEMP/orchill-smoke-project" "$RUNNER_TEMP/orchill-init-smoke" "$RUNNER_TEMP/orchill-category-smoke"
          orchill install analyzing-dotnet-performance --cwd "$RUNNER_TEMP/orchill-smoke-project"
          test -f "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/analyzing-dotnet-performance/SKILL.md"
          test -f "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/analyzing-dotnet-performance/references/critical-patterns.md"
          orchill install-category Accessibility --yes --cwd "$RUNNER_TEMP/orchill-category-smoke"
          test -f "$RUNNER_TEMP/orchill-category-smoke/.agents/skills/audit-website/SKILL.md"
          test ! -e "$RUNNER_TEMP/orchill-category-smoke/.agents/skills/web-design-guidelines"
          orchill install demo-focus --cwd "$RUNNER_TEMP/orchill-smoke-project"
          test -f "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/demo-focus/SKILL.md"
          orchill verify demo-focus --cwd "$RUNNER_TEMP/orchill-smoke-project"
          orchill uninstall demo-focus --yes --cwd "$RUNNER_TEMP/orchill-smoke-project"
          test ! -e "$RUNNER_TEMP/orchill-smoke-project/.agents/skills/demo-focus"
          orchill init --cwd "$RUNNER_TEMP/orchill-init-smoke"
          test -f "$RUNNER_TEMP/orchill-init-smoke/.orchill/skills.json"

